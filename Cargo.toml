[package]
name = "cliptray"
version = "0.1.1"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.105"
arboard = { version = "3", features = ["wayland-data-control"] }
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive"] }
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2.191"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.2"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
x11rb = { version = "0.14.0", features = ["xtest"] }
zbus = "5"

# eframe 没有转出 winit；面板要用它把 macOS 激活策略设成 Accessory（不出现在 Dock），
# 并通过窗口句柄把面板层级提到 Dock 之上。版本须与 eframe 用的一致。
# tray-icon 只在 macOS 上创建 NSStatusItem；Linux 用 ksni（StatusNotifierItem），避免再链一套 GTK。
[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30.13", default-features = false }
raw-window-handle = "0.6.2"
tray-icon = "0.21"

[dev-dependencies]
tempfile = "3.27.0"

[[test]]
name = "macos_hotkey"
harness = false
